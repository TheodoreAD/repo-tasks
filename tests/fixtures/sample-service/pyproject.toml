[project]
name = "sample-service"
version = "0.1.0"
description = "Minimal stdlib-only HTTP service, here purely to exercise repo-tasks' docker/helm/version-grouping tasks against a real artifact."
requires-python = ">=3.11"
# Deliberately empty: the point of this sample is to exercise the build/image/chart path, not to
# demonstrate dependency resolution. A dependency here would slow every Dockerfile layer test for
# nothing.
dependencies = []

[project.scripts]
sample-service = "sample_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_service"]
