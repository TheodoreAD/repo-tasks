replicaCount: 1

image:
  repository: ghcr.io/theodoread/sample-service
  pullPolicy: IfNotPresent
  # Empty on purpose: the chart falls back to .Chart.AppVersion, which the group bump keeps in
  # step with the image tag `inv docker.release` pushes. Set this only to pin an override.
  tag: ""

service:
  type: ClusterIP
  port: 80

# The container's own port, which the service targets. sample-service reads it from $PORT.
containerPort: 8000

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
