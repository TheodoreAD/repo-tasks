[project]
name = "repo-tasks"
version = "0.2.0"
requires-python = ">=3.11"
# The platforms this actually claims. Linux and macOS are each exercised by a CI job; Windows is
# not claimed, and the reasons are concrete rather than caution — see plans/. Declared here so the
# claim has one machine-readable home, even though this package is installed from git rather than
# an index.
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "invoke",
  "python-dotenv",
  "bump-my-version",
  "dunamai>=1.26.2",
]

[project.scripts]
repo-tasks = "repo_tasks.cli:program.run"

[dependency-groups]
# Not a tier — an exported manifest. configs.ensure_deps splices these exact entries into a
# consumer's own dependency-groups.dev, sourced from the copy of this file packaged into the wheel,
# so its contents are public API in a way no other group's are. Named for its owner so it doesn't
# read as "the quality tier" and get folded into dev like everything else was.
repo-tasks-quality = [
  "basedpyright>=1.39.10",
  # Partial stubs so `@task` keeps the decorated function's signature and `from invoke import task`
  # is a public re-export to the type checker — see contributing/type-checking.md.
  # Git-sourced like repo-tasks itself; drop once a released invoke carries the same signatures.
  "invoke-stubs @ git+https://github.com/TheodoreAD/invoke-stubs",
  "pytest",
  # The three pytest plugins the family standardises on. Shipped rather than left per-repo because
  # each is inert until something asks for it — pytest-cov does nothing without `--cov`,
  # pytest-socket nothing without `disable_socket()` or `--disable-socket`, pytest-timeout nothing
  # without `--timeout`, a `timeout` ini key or the marker — so a consumer that wants none of them
  # pays a few tens of KB of wheels already in its resolver's graph. Having them present everywhere
  # is what lets a test tree opt in with a fixture instead of a dependency edit.
  #
  # Inertness is measured, not assumed: each was run against this repo's full unit tier with
  # nothing else changed, under a pty, because a piped run cannot detect an output plugin. The
  # survey that settled the set — one adoption, nine recommendations, thirteen recorded rejections
  # — is plans/2026-08-27-pytest-plugin-survey.md.
  "pytest-cov",
  "pytest-socket",
  # The integration tier drives real subprocesses, Docker and a package index. A hang there ends as
  # a CI job killed at `timeout-minutes` with nothing naming the test that stopped; a per-test
  # timeout turns that into a named failure. The only gap the plugin survey found.
  "pytest-timeout",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
  "actionlint-py",
  "zizmor",
  "hadolint-py",
  "act-bin",
]
# The only group install/sync tasks address, alongside the main dependencies. Everything this repo
# needs to develop and test itself lives here; there is deliberately no third group to remember,
# and no task takes a --group flag.
dev = [
  { include-group = "repo-tasks-quality" },
  # The integration tier's real package index: `uv publish` uploads to it and `dist.list_versions`
  # reads the PEP 503 HTML back, sha256 fragments and all. Chosen over devpi, which served the JSON
  # branch too but cost 61 resolved packages against pypiserver's 4 — and pinned `setuptools<=81`
  # (via pyramid's `<82`), holding two advisories open that nothing here could fix. The JSON branch
  # is served by a stub instead; see contributing/test-tiers.md.
  "pypiserver>=2.4.1",
  "testcontainers>=4.15.0",
]

# Named so `inv dist.publish --index testpypi` / `inv dist.list-versions --index testpypi` can
# target it. `explicit = true` keeps it out of ordinary dependency resolution entirely — it is
# only ever consulted by a command naming it. Real PyPI needs no entry: it is uv's implicit
# default, so the bare `inv dist.publish` already targets it.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.workspace]
# The one member is this repo's dogfood sample (tests/fixtures/sample-service) — a real second
# project
# so `projects.py`'s workspace resolution, the docker/helm task modules, and the shared version
# group are exercised against something real rather than only mocked. A consumer repo needs this
# table only if it actually has members; the single-project fallback stays zero-config.
members = ["tests/fixtures/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "repo_tasks/pyproject.toml"
