[project]
name = "repo-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["invoke", "python-dotenv", "bump-my-version"]

[project.scripts]
repo-tasks = "repo_tasks.cli:program.run"

[dependency-groups]
quality = [
  "basedpyright>=1.39.10",
  "pytest",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
]
dev = [
  { include-group = "quality" },
]
integration = [
  "devpi-client>=7.3.0",
  "devpi-server>=6.20.3",
  "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "repo_tasks/pyproject.toml"
