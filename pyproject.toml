[project]
name = "repo-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["invoke", "python-dotenv"]

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "bump-my-version",
  "pytest",
  "ruff",
]
integration = [
  "devpi-client>=7.3.0",
  "devpi-server>=6.20.3",
  "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]
