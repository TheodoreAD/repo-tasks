[project]
name = "repo-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "invoke",
  "python-dotenv",
  "bump-my-version",
  "dunamai>=1.26.2",
]

[project.scripts]
repo-tasks = "repo_tasks.cli:program.run"

[dependency-groups]
# Not a tier — an exported manifest. configs.ensure_deps splices these exact entries into a
# consumer's own dependency-groups.dev, sourced from the copy of this file packaged into the wheel,
# so its contents are public API in a way no other group's are. Named for its owner so it doesn't
# read as "the quality tier" and get folded into dev like everything else was.
repo-tasks-quality = [
  "basedpyright>=1.39.10",
  # Partial stubs so `@task` keeps the decorated function's signature and `from invoke import task`
  # is a public re-export to the type checker — see contributing/type-checking.md.
  # Git-sourced like repo-tasks itself; drop once a released invoke carries the same signatures.
  "invoke-stubs @ git+https://github.com/TheodoreAD/invoke-stubs",
  "pytest",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
  "actionlint-py",
  "zizmor",
  "act-bin",
]
# The only group install/sync tasks address, alongside the main dependencies. Everything this repo
# needs to develop and test itself lives here; there is deliberately no third group to remember,
# and no task takes a --group flag.
dev = [
  { include-group = "repo-tasks-quality" },
  "devpi-client>=7.3.0",
  "devpi-server>=6.20.3",
  "testcontainers>=4.15.0",
]

# Named so `inv dist.publish --index testpypi` / `inv dist.list-versions --index testpypi` can
# target it. `explicit = true` keeps it out of ordinary dependency resolution entirely — it is
# only ever consulted by a command naming it. Real PyPI needs no entry: it is uv's implicit
# default, so the bare `inv dist.publish` already targets it.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.workspace]
# The one member is this repo's dogfood sample (tests/fixtures/sample-service) — a real second
# project
# so `projects.py`'s workspace resolution, the docker/helm task modules, and the shared version
# group are exercised against something real rather than only mocked. A consumer repo needs this
# table only if it actually has members; the single-project fallback stays zero-config.
members = ["tests/fixtures/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "repo_tasks/pyproject.toml"
