[project]
name = "repo-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["invoke"]

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "bump-my-version",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]
