[project]
name = "repo-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["invoke", "python-dotenv", "bump-my-version"]

[project.scripts]
repo-tasks = "repo_tasks.cli:program.run"

[dependency-groups]
# Not a tier — an exported manifest. configs.ensure_deps splices these exact entries into a
# consumer's own dependency-groups.dev, sourced from the copy of this file packaged into the wheel,
# so its contents are public API in a way no other group's are. Named for its owner so it doesn't
# read as "the quality tier" and get folded into dev like everything else was.
repo-tasks-quality = [
  "basedpyright>=1.39.10",
  "pytest",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
]
# The only group install/sync tasks address, alongside the main dependencies. Everything this repo
# needs to develop and test itself lives here; there is deliberately no third group to remember,
# and no task takes a --group flag.
dev = [
  { include-group = "repo-tasks-quality" },
  "devpi-client>=7.3.0",
  "devpi-server>=6.20.3",
  "testcontainers>=4.15.0",
]

[tool.uv.workspace]
# The one member is this repo's dogfood sample (tests/fixtures/sample-service) — a real second
# project
# so `projects.py`'s workspace resolution, the docker/helm task modules, and the shared version
# group are exercised against something real rather than only mocked. A consumer repo needs this
# table only if it actually has members; the single-project fallback stays zero-config.
members = ["tests/fixtures/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_tasks"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "repo_tasks/pyproject.toml"
