name: publish

# Publish repo-tasks to a package index with the repo's own `inv dist.publish` —
# plans/2026-08-22-pypi-publish-integration.md §4. TestPyPI is unconditional and runs first; the
# real index is a second job behind the `pypi` GitHub Environment, whose required-reviewer rule is
# the actual safety gate: a version uploaded to pypi.org can never be re-uploaded, even after
# deletion, so a human confirms before that step, every time.
#
# Auth is Trusted Publishing (OIDC): `permissions: id-token: write` lets uv exchange the job's
# short-lived GitHub ID token for a short-lived upload token, so no PyPI secret is stored anywhere.
# Both indexes need a one-time "pending publisher" registered by hand for
# TheodoreAD/repo-tasks + this filename (and, for pypi.org, the `pypi` environment) before the
# first run can succeed — that setup lives outside this repo by design.
#
# Release candidates (`vX.Y.ZrcN`, tagged on the release branch by `inv gitflow.release-candidate`)
# reach TestPyPI only: the real-index job is skipped for any tag carrying `rc`, so a candidate is
# never one approval click away from pypi.org. A final tag runs both.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions:
  contents: read
  id-token: write

# Actions are pinned to full-length commit SHAs here, and only here. A tag is a mutable ref: whoever
# can move `v4` can run their code in a job holding `id-token: write` against PyPI Trusted
# Publishing, which is the one credential in this repo worth stealing. ci.yml keeps plain tags —
# pinning everywhere without dependabot means pins that silently rot, and dependabot means a standing
# PR stream on a repo that is pushed to directly. One file's pins are maintainable by hand.
#
# To refresh: `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`, and update the
# trailing comment to match.
jobs:
  testpypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./bootstrap.sh
      - run: inv dist.publish --index testpypi

  pypi:
    needs: testpypi
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./bootstrap.sh
      - run: inv dist.publish
