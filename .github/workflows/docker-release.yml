name: docker-release

# Build and push the dogfood sample's image to GHCR with the repo's own `inv docker.release` —
# the real, external half of plans/2026-08-22-docker-registry-integration.md. Manually triggered
# only, like the auth smoke test before it: a registry push is deliberate and occasional, never a
# side effect of every commit (the every-commit tier runs against a throwaway local registry, see
# contributing/test-tiers.md). A tag-push trigger waits on the per-group tag scheme
# (`<group>-vX.Y.Z`, contributing/versioning.md) actually existing in version.py — until then a
# `v*` tag names the root project's version, not the sample's.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Image to release — a [[docker]] name from repo-tasks.toml"
        default: sample-service
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: ./bootstrap.sh

      # GITHUB_TOKEN is enough for ghcr.io: no PAT, no repo secret. The image ref itself comes from
      # repo-tasks.toml, which already lowercases the owner segment (GHCR rejects uppercase).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: inv docker.release --project ${{ inputs.project }}
