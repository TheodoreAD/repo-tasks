name: docker-release

# Build and push the dogfood sample's image to GHCR with the repo's own `inv docker.release` — see
# contributing/release-workflows.md for the registry choice, the auth, and why this is manually
# triggered only: a registry push is deliberate and occasional, never a side effect of every commit
# (the every-commit tier runs against a throwaway local registry, contributing/test-tiers.md). A
# tag-push trigger waits on the per-group tag scheme (`<group>-vX.Y.Z`, contributing/versioning.md)
# actually existing in version.py — until then a `v*` tag names the root project's version, not the
# sample's.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Image to release — a [[docker]] name from repo-tasks.toml"
        default: sample-service
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./bootstrap.sh

      # GITHUB_TOKEN is enough for ghcr.io: no PAT, no repo secret. The image ref itself comes from
      # repo-tasks.toml, which already lowercases the owner segment (GHCR rejects uppercase).
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The input goes through `env:`, not straight into the run block. A `${{ }}` expansion is
      # pasted into the shell script before it runs, so a dispatch input containing shell syntax
      # would execute as code in a job holding `packages: write`; `"$PROJECT"` is read as data.
      - run: inv docker.release --project "$PROJECT"
        env:
          PROJECT: ${{ inputs.project }}
