name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes anything back to the repo, and the default token grant is
# broader than that. publish.yml declares its own, wider, set for Trusted Publishing.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials: false everywhere in this repo — nothing here pushes back, and the
      # default leaves the job's token in .git/config, where any later step (or an uploaded
      # artifact built from the checkout) can read it. zizmor's `artipacked` audit is what asks.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./bootstrap.sh
      - run: inv quality.check

  # The gate job above runs one interpreter, whichever uv picks. `requires-python = ">=3.11"` is a
  # claim about four, and this is what makes it true. Only the unit tier: it needs no Docker and
  # finishes in well under a second, so four of them cost nothing, while the integration tier is
  # opt-in everywhere and the rest of the gate is interpreter-independent.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One interpreter failing should still report the others — that is the difference between
      # "3.11 is broken" and "everything is broken".
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: ./bootstrap.sh
      - run: inv test.unit

  # macOS is a supported platform, so something has to run there. Ubuntu covers the interpreter
  # matrix above; this covers the OS, on one interpreter, because the two questions are independent
  # and the product of them buys nothing. Added 2026-09-06 with the platform claim itself: every
  # gate tool was checked to have a macOS build (`actionlint-py` ships checksummed darwin binaries,
  # `basedpyright` is py3-none-any, the rest publish macOS wheels), and a claim backed only by a
  # dependency audit is the kind this repo tags `[UNVERIFIED:`. Windows is deliberately not here —
  # see plans/.
  unit-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./bootstrap.sh
      - run: inv test.unit
