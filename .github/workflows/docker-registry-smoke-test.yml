name: docker-registry-smoke-test

# One-off, manually-triggered proof that GITHUB_TOKEN + docker/login-action can authenticate
# against ghcr.io and push, before this repo has any real Dockerfile to build for real (see
# plans/2026-08-22-docker-registry-integration.md Design §6, verification step 1). Not wired into
# the regular CI trigger -- deliberate/occasional, same as the real docker-release workflow will be.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref (GHCR requires lowercase)
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - run: docker pull hello-world
      - run: docker tag hello-world ghcr.io/${{ steps.vars.outputs.owner }}/repo-tasks-scratch:smoke-test
      - run: docker push ghcr.io/${{ steps.vars.outputs.owner }}/repo-tasks-scratch:smoke-test
