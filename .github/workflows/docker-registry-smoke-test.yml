name: docker-registry-smoke-test

# One-off, manually-triggered proof that GITHUB_TOKEN + docker/login-action can authenticate
# against ghcr.io and push, from before this repo had any real Dockerfile to build. Superseded for
# everything but a quick auth check by docker-release.yml (see contributing/release-workflows.md).
# Not wired into the regular CI trigger -- deliberate/occasional, same as docker-release.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref (GHCR requires lowercase)
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - run: docker pull hello-world
      - run: docker tag hello-world ghcr.io/${{ steps.vars.outputs.owner }}/repo-tasks-scratch:smoke-test
      - run: docker push ghcr.io/${{ steps.vars.outputs.owner }}/repo-tasks-scratch:smoke-test
